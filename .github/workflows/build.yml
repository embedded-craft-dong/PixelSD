name: Windows build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt
      - run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: PixelSD-windows-x64
          path: |
            dist/PixelSD.exe
            licenses/
            README.md
            README.zh-CN.md
            VALIDATION.md
            VALIDATION.zh-CN.md
